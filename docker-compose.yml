version: "3.8"

services:
  # Local Stellar network (Quickstart image runs Horizon + Core + Friendbot)
  stellar-local:
    image: stellar/quickstart:latest
    container_name: pulsar-stellar-local
    ports:
      - "8000:8000"   # Horizon API
      - "11625:11625" # Stellar Core peer port
    environment:
      - NETWORK=local
    command: --local --enable-soroban-rpc
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Development container with Rust + Stellar CLI pre-installed
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pulsar-dev
    volumes:
      - .:/workspace
      - cargo-cache:/usr/local/cargo/registry
    environment:
      - STELLAR_NETWORK_PASSPHRASE=Standalone Network ; February 2017
      - STELLAR_RPC_URL=http://stellar-local:8000/soroban/rpc
      - STELLAR_HORIZON_URL=http://stellar-local:8000
    depends_on:
      stellar-local:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Monitoring service for the Pulsar contract
  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: pulsar-monitoring
    environment:
      - CONTRACT_ID=${CONTRACT_ID:-}
      - HORIZON_URL=${HORIZON_URL:-http://stellar-local:8000}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-5000}
      - PING_INTERVAL_MS=${PING_INTERVAL_MS:-60000}
      - REFUND_RATE_THRESHOLD=${REFUND_RATE_THRESHOLD:-0.1}
      - REFUND_RATE_WINDOW_MS=${REFUND_RATE_WINDOW_MS:-300000}
      - LARGE_PAYMENT_THRESHOLD=${LARGE_PAYMENT_THRESHOLD:-1000}
      - ERROR_RATE_THRESHOLD=${ERROR_RATE_THRESHOLD:-0.05}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    depends_on:
      stellar-local:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cargo-cache: