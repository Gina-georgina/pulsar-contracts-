name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
    - cron: '0 3 * * *'  # Nightly at 03:00 UTC — fuzz run (T-023)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # DO-001 / DO-015: Cargo.lock is committed to the repository to ensure
  # reproducible builds across all environments. All cargo build/test/clippy/
  # llvm-cov commands pass --locked so CI refuses to silently update the lock
  # file and fails fast if it has drifted from Cargo.toml.
  # See docs/reproducible-builds.md for full rationale.
  # Note: `cargo fmt` and `cargo audit` do not accept --locked; fmt operates
  # on source files only and audit reads the lock file directly.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - "1.79.0"  # MSRV — keep in sync with rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@v4

      # DO-008: fail fast if the MSRV declared in the contract Cargo.toml
      # drifts from the MSRV pinned in the matrix above.  This automates the
      # "kept in sync" acceptance criterion so a maintainer forgetting to
      # update one side is caught at CI time rather than after a release.
      - name: Verify MSRV is in sync (Cargo.toml ↔ CI matrix)
        run: |
          set -euo pipefail
          CARGO_MSRV=$(grep -E '^rust-version' contracts/payment-processing-contract/Cargo.toml \
            | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          CI_MSRV=$(grep -E '# MSRV' .github/workflows/ci.yml \
            | head -1 | sed -E 's/.*"([0-9.]+)".*# MSRV.*/\1/')
          echo "Cargo.toml rust-version: $CARGO_MSRV"
          echo "CI matrix MSRV:          $CI_MSRV"
          if [ "$CARGO_MSRV" != "$CI_MSRV" ]; then
            echo "::error::MSRV mismatch — Cargo.toml has $CARGO_MSRV but the CI matrix has $CI_MSRV. Update both to keep them in sync (see issue DO-008)."
            exit 1
          fi
          echo "MSRV in sync: $CARGO_MSRV"

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Get rustc version
        id: rustc-version
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ steps.rustc-version.outputs.version }}-
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check license headers
        run: bash scripts/check-license-headers.sh

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked
        working-directory: contracts/payment-processing-contract

  # DO-031: Run the Node.js / TypeScript package test suites. This job runs in
  # parallel with the Rust `test` job (no `needs` dependency) and fails if any
  # package's test suite fails (no continue-on-error).
  node-tests:
    name: Node Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - indexer
          - monitoring
          - services/webhook
          - services/analytics-service
          - sdk
          - frontend
          - api
          - dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json in ${{ matrix.package }}; falling back to npm install."
            npm install
          fi

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: npm test

      - name: Write test summary
        if: always()
        run: |
          echo "## Node Tests — ${{ matrix.package }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`${{ matrix.package }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node version | 20 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/coverage/
            ${{ matrix.package }}/lcov.info
          if-no-files-found: ignore
          retention-days: 30

  # T-011: Property-based tests — run as a separate CI job so failures are
  # surfaced independently of the main unit-test suite.
  # See docs/fuzz-and-property-tests.md for how to run locally.
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version
        id: rustc-version
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-proptest-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-proptest-${{ steps.rustc-version.outputs.version }}-
            ${{ runner.os }}-cargo-proptest-

      - name: Run property-based tests
        # Runs only the prop_ prefixed tests from prop_tests.rs with 512 cases.
        # Set PROPTEST_CASES to a higher value to increase coverage in nightly/
        # scheduled runs. See docs/fuzz-and-property-tests.md.
        run: cargo test prop_ --all-features --locked
        working-directory: contracts/payment-processing-contract
        env:
          PROPTEST_CASES: 512

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Get rustc version
        id: rustc-version
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ steps.rustc-version.outputs.version }}-
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --locked
        working-directory: contracts/payment-processing-contract

      # DO-003: Gate on WASM binary size to catch regressions before they hit
      # Soroban's hard limit (~128 KB). Hard fail >100 KB, warn at >80 KB.
      - name: Check WASM binary size
        run: |
          WASM=target/wasm32-unknown-unknown/release/payment_processing_contract.wasm
          SIZE=$(wc -c < "$WASM")
          # Use awk for a decimal KB value (e.g. 73.4 KB) instead of truncated integer division.
          SIZE_KB=$(awk "BEGIN { printf \"%.1f\", $SIZE / 1024 }")
          PCT=$(awk "BEGIN { printf \"%d\", ($SIZE / 102400) * 100 }")
          WARN_LIMIT=81920   # 80 KB
          HARD_LIMIT=102400  # 100 KB
          STATUS="✅ Within limits"
          if [ "$SIZE" -gt "$HARD_LIMIT" ]; then
            STATUS="❌ EXCEEDS 100 KB HARD LIMIT"
          elif [ "$SIZE" -gt "$WARN_LIMIT" ]; then
            STATUS="⚠️ Above 80 KB warning threshold"
          fi
          echo "## WASM Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | payment_processing_contract.wasm |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | ${SIZE_KB} KB (${SIZE} bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hard limit | 100 KB (102400 bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warning threshold | 80 KB (81920 bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| % of hard limit | ${PCT}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "WASM size: ${SIZE_KB} KB (${SIZE} bytes) — ${PCT}% of 100 KB hard limit"
          if [ "$SIZE" -gt "$HARD_LIMIT" ]; then
            echo "::error::WASM binary exceeds 100 KB limit (${SIZE_KB} KB / ${SIZE} bytes). Reduce contract size before merging."
            exit 1
          elif [ "$SIZE" -gt "$WARN_LIMIT" ]; then
            echo "::warning::WASM binary is above 80 KB warning threshold (${SIZE_KB} KB). Consider reducing contract size."
          else
            echo "WASM size is within limits."
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-processing-contract.wasm
          path: target/wasm32-unknown-unknown/release/payment_processing_contract.wasm
          retention-days: 30

  release:
    name: Release WASM
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # required to upload files to GitHub Releases
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Get rustc version
        id: rustc-version
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ steps.rustc-version.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ steps.rustc-version.outputs.version }}-
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --locked
        working-directory: contracts/payment-processing-contract

      - name: Generate SHA-256 checksum
        run: |
          sha256sum target/wasm32-unknown-unknown/release/payment_processing_contract.wasm \
            > target/wasm32-unknown-unknown/release/payment_processing_contract.wasm.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wasm32-unknown-unknown/release/payment_processing_contract.wasm
            target/wasm32-unknown-unknown/release/payment_processing_contract.wasm.sha256

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.13 --locked

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
        working-directory: contracts/payment-processing-contract

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: contracts/payment-processing-contract/lcov.info
          retention-days: 30

      - name: Check minimum line coverage (80% — warning only)
        run: |
          COVERAGE=$(cargo llvm-cov --all-features --locked --summary-only 2>&1 \
            | grep -E '^TOTAL' | awk '{print $10}' | tr -d '%')
          echo "Line coverage: ${COVERAGE}%"
          # Write coverage summary to GitHub Step Summary
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Line Coverage | ${COVERAGE}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Threshold | 80% (warning only) |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COVERAGE" ] && [ "$(echo "$COVERAGE < 80" | bc -l)" = "1" ]; then
            echo "| Status | ⚠️ Below threshold |" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Line coverage ${COVERAGE}% is below the 80% threshold. Please add tests."
          else
            echo "| Status | ✅ Threshold met |" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage threshold met: ${COVERAGE}%"
          fi
        working-directory: contracts/payment-processing-contract

  # DO-028: Build the production Docker image and scan it for known OS and
  # dependency vulnerabilities with Trivy. The job fails on any CRITICAL
  # finding (exit-code 1) and uploads the full report as an artifact. It runs
  # on push/PR and also on the weekly schedule (see `on.schedule` above), so
  # newly disclosed CVEs in the base image are caught independently of PRs.
  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results
    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build -t payment-processing-contract:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: payment-processing-contract:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Run Trivy scan (SARIF for code scanning)
        # Runs after the gating scan above; `if: always()` ensures the SARIF
        # report is produced even when the gating scan failed on CRITICAL
        # findings, so results are still visible in the Security tab.
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: payment-processing-contract:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload Trivy scan report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo-audit binary cache
        id: cargo_audit_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.21.2
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Restore advisory-db cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: ${{ runner.os }}-advisory-db-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-advisory-db-

      - name: Install cargo-audit
        if: steps.cargo_audit_cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.21.2 --locked

      - name: Run audit
        # SEC-008: --deny warnings causes the job to fail on any advisory
        # (vulnerability, unmaintained, unsound, notice). The cargo-audit
        # binary is pinned to 0.21.2 (see install step) so a new advisory DB
        # release cannot silently change CI behaviour; the weekly
        # refresh-advisory-db job below keeps the DB current on a controlled
        # schedule.
        run: cargo audit --deny warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # DO-032: Lint and type-check all Node.js/TypeScript packages. Clippy only
  # covers the Rust contract; this job keeps the frontend, dashboard, services
  # and SDK free of lint and type errors. Any non-zero exit fails the job.
  lint:
    name: Lint & Typecheck (Node.js/TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # package path, whether it is a TypeScript package (needs tsc --noEmit)
          - package: frontend
            typescript: true
          - package: dashboard
            typescript: false
          - package: api
            typescript: false
          - package: indexer
            typescript: false
          - package: monitoring
            typescript: false
          - package: sdk
            typescript: true
          - package: services/analytics-service
            typescript: true
          - package: services/webhook
            typescript: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ESLint (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: npx --no-install eslint .

      - name: TypeScript strict check (${{ matrix.package }})
        if: matrix.typescript
        working-directory: ${{ matrix.package }}
        run: npx --no-install tsc --noEmit

  # MISC-014: errors.ts / error-registry.json are generated from error.rs by
  # sdk/scripts/generate-errors.js. Fail CI if the committed files have
  # drifted from what error.rs would generate, so the two cannot silently
  # go out of sync.
  sdk-errors-sync:
    name: SDK errors.ts in sync with error.rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sdk/errors.ts and sdk/error-registry.json
        run: node sdk/scripts/generate-errors.js

      - name: Fail if generated output differs from committed files
        run: |
          if ! git diff --exit-code -- sdk/errors.ts sdk/error-registry.json; then
            echo "::error::sdk/errors.ts or sdk/error-registry.json is out of sync with contracts/payment-processing-contract/src/error.rs. Run 'node sdk/scripts/generate-errors.js' and commit the result."
            exit 1
          fi

  deploy-testnet:
    # DO-002: Automated testnet deployment job — triggered only on push to main
    # (not on PRs). Uses a CI-managed testnet key stored in GitHub Secrets as
    # TESTNET_SECRET_KEY. The deployed contract ID is captured as a job output
    # and written to the GitHub Step Summary for visibility.
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: testnet
    outputs:
      contract_id: ${{ steps.deploy.outputs.contract_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: payment-processing-contract.wasm
          path: target/wasm32-unknown-unknown/release/

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Deploy contract
        id: deploy
        env:
          TESTNET_SECRET: ${{ secrets.TESTNET_SECRET_KEY }}
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/payment_processing_contract.wasm \
            --source-account "$TESTNET_SECRET" \
            --network testnet)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract ID: $CONTRACT_ID"

      - name: Write deployment summary
        run: |
          echo "## Testnet Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract ID | \`${{ steps.deploy.outputs.contract_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | testnet |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> "$GITHUB_STEP_SUMMARY"

  # DO-022: Build the multi-stage production Dockerfile and scan the resulting
  # image for HIGH/CRITICAL vulnerabilities with Trivy. The runtime image must
  # contain only the compiled binary and config — no cargo/npm toolchains.
  docker-image:
    name: Build & Scan Production Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build -t pulsar-contract:ci .

      - name: Verify no dev toolchains in runtime image
        run: |
          set -euo pipefail
          for tool in cargo rustc npm node; do
            if docker run --rm --entrypoint sh pulsar-contract:ci -c "command -v $tool" >/dev/null 2>&1; then
              echo "::error::$tool found in production image — dev dependencies must not be present."
              exit 1
            fi
          done
          echo "No dev toolchains present in the production image."

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulsar-contract:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  smoke-test:
    name: Smoke Test (Testnet)
    runs-on: ubuntu-latest
    needs: deploy-testnet
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      # DO-026: end-to-end payment flow — register merchant → process payment
      # → query payment → verify status. The script exits non-zero on any
      # failed step and prints per-step timing.
      - name: Run smoke test
        env:
          CONTRACT_ID: ${{ needs.deploy-testnet.outputs.contract_id }}
          ADMIN_SECRET: ${{ secrets.TESTNET_SECRET_KEY }}
          NETWORK: testnet
        run: bash scripts/smoke-test.sh

  # DOC-013: Generate the API reference from JSDoc/TSDoc comments and publish
  # it to GitHub Pages on every push to main. The docs are built with the
  # root `docs:generate` script (see package.json) and deployed as a Pages
  # artifact using the official GitHub Pages actions.
  docs:
    name: Generate & Publish API Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API reference
        run: npm run docs:generate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # SEC-008: Scheduled weekly job that refreshes the cargo-audit advisory
  # database and re-runs the audit so that newly published advisories are
  # caught within a week, independently of any code change.
  refresh-advisory-db:
    name: Weekly Advisory DB Refresh
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo-audit cache
        id: cargo_audit_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.21.2
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        if: steps.cargo_audit_cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.21.2 --locked

      - name: Update advisory database
        # Fetch the latest RustSec advisory DB from GitHub so the next
        # on-demand audit run uses current data.
        run: cargo audit --deny warnings --update
