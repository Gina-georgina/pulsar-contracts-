name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # DO-021: Validate that the pushed tag is a valid semantic version before
  # any release work happens. Non-semver tags (e.g. `test`, `v1`) are rejected.
  validate-tag:
    name: Validate Semver Tag (DO-021)
    runs-on: ubuntu-latest
    steps:
      - name: Check tag matches semver pattern
        run: |
          SEMVER_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+.*$'
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "Not a tag push (branch: ${GITHUB_REF}); skipping semver validation."
            exit 0
          fi
          if ! echo "$TAG" | grep -Eq "$SEMVER_REGEX"; then
            echo "::error::DO-021: Tag '$TAG' is not a valid semantic version."
            echo "::error::Tags must match v[0-9]+.[0-9]+.[0-9]+* (e.g. v1.2.3)."
            exit 1
          fi
          echo "Tag '$TAG' is a valid semantic version."

  # DO-021: Bash assertion test for the version regex.
  semver-regex-test:
    name: Semver Regex Test (DO-021)
    runs-on: ubuntu-latest
    steps:
      - name: Assert regex accepts valid and rejects invalid tags
        run: |
          SEMVER_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+.*$'
          fail=0
          for tag in v1.2.3 v0.0.1 v10.20.30 v1.2.3-rc.1; do
            if echo "$tag" | grep -Eq "$SEMVER_REGEX"; then
              echo "PASS: '$tag' accepted"
            else
              echo "FAIL: '$tag' should be accepted"
              fail=1
            fi
          done
          for tag in test v1 1.2.3 v1.2 v1.2.3.4x; do
            if echo "$tag" | grep -Eq "$SEMVER_REGEX"; then
              echo "FAIL: '$tag' should be rejected"
              fail=1
            else
              echo "PASS: '$tag' rejected"
            fi
          done
          exit $fail

  # SEC-001: Block the release if no completed audit report has been published
  # in this repository. The report must exist as a file matching the pattern
  # docs/audit-report-*.{pdf,md} before a release tag can be created.
  # To bypass during development/pre-mainnet, remove this job or add a
  # docs/audit-report-*.md placeholder — but never deploy to mainnet without
  # a real external audit report.
  audit-gate:
    name: Security Audit Gate (SEC-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify audit report exists
        run: |
          REPORTS=$(find docs -maxdepth 1 -name "audit-report-*" \( -name "*.pdf" -o -name "*.md" \) 2>/dev/null | grep -v "^$" | head -5)
          if [ -z "$REPORTS" ]; then
            echo "::error::SEC-001 deployment gate: No audit report found under docs/."
            echo "::error::A completed security audit report (docs/audit-report-<version>-<auditor>.pdf or .md)"
            echo "::error::must be committed to this repository before a release can be created."
            echo "::error::See docs/security-audit.md for the full audit process and requirements."
            exit 1
          fi
          echo "Audit report(s) found:"
          echo "$REPORTS"

  check-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' contracts/payment-processing-contract/Cargo.toml \
            | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create GitHub Release
    needs: [audit-gate, validate-tag, semver-regex-test, check-version]
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          # Extract the section between ## [VERSION] and the next ## heading
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          # Write to a file to preserve newlines
          echo "$NOTES" > release_notes.md

      - name: Create tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file release_notes.md

  publish-docker-images:
    name: Publish Docker images to GHCR
    needs: [check-version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push indexer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/indexer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/indexer:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ github.repository }}/indexer:latest

      - name: Build and push webhook image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/webhook/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/webhook:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ github.repository }}/webhook:latest

      - name: Build and push analytics-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analytics-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/analytics-service:${{ needs.check-version.outputs.version }}
            ghcr.io/${{ github.repository }}/analytics-service:latest
